# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: news-rating-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: news-rating
  template:
    metadata:
      labels:
        app: news-rating
    spec:
      containers:
        - name: news-rating-app
          image: stefanfotin23/news-rating-app
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: news-data-volume
              mountPath: "/app/model"  # Mounting PVC inside container
      volumes:
        - name: news-data-volume
          persistentVolumeClaim:
            claimName: news-data-pvc
